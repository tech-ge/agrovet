<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karen Agrovet</title>
  <meta name="theme-color" content="#16a34a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon" data-icon="sprout" data-size="44"></div>
      <h1>Karen Agrovet</h1>
      <p>Initial System Setup</p>
    </div>

    <form id="registerForm" class="auth-form">
      <h2>Create Admin Account</h2>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="admin@agrovet.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="6" placeholder="Min 6 characters" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create Account</button>
      <p id="error" class="error-text"></p>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="/login.html">Sign in</a>
    </p>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sw-register.js"></script>
  <script>
    Icons.render();
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('error');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Creating...';
      try {
        await Auth.register({
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        });
        window.location.href = '/dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || 'Registration failed';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
